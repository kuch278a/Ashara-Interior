<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ashara Interiors</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect handler
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      var subPath = l.pathname.split('/').slice(2).join('/');
      
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + (repoName ? repoName + '/' : '') +
        (subPath ? '#' + subPath : '') +
        l.search;
      
      window.location.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
