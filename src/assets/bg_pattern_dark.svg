<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <rect width="120" height="120" fill="#0A1525" />
  
  <!-- Subtle architectural drafting lines in dark mode -->
  <line x1="10" y1="8" x2="115" y2="24" stroke="#122036" stroke-width="4" stroke-linecap="round" />
  <line x1="25" y1="68" x2="130" y2="84" stroke="#122036" stroke-width="4" stroke-linecap="round" />
  <line x1="96" y1="32" x2="102" y2="115" stroke="#122036" stroke-width="4" stroke-linecap="round" />
  <line x1="36" y1="-10" x2="42" y2="70" stroke="#122036" stroke-width="4" stroke-linecap="round" />

  <!-- Geometric Dot Matrix (30px grid) -->
  <g fill="#253A54">
    <!-- Row 1 -->
    <polygon points="0,0 0.8,0 0,0.8 -0.8,0 0,-0.8" />
    <polygon points="30,0 30.8,0 30,0.8 29.2,0 30,-0.8" />
    <polygon points="60,0 60.8,0 60,0.8 59.2,0 60,-0.8" />
    <polygon points="90,0 90.8,0 90,0.8 89.2,0 90,-0.8" />
    <polygon points="120,0 120.8,0 120,0.8 119.2,0 120,-0.8" />

    <!-- Row 2 -->
    <polygon points="0,30 1,30 0,31 -1,30 0,29" />
    <polygon points="30,30 31,30 30,31 29,30 30,29" />
    <polygon points="60,30 61,30 60,31 59,30 60,29" />
    <polygon points="90,30 91,30 90,31 89,30 90,29" />
    <polygon points="120,30 121,30 120,31 119,30 120,29" />

    <!-- Row 3 -->
    <polygon points="0,60 1,60 0,61 -1,60 0,59" />
    <polygon points="30,60 31,60 30,61 29,60 30,59" />
    <polygon points="60,60 61,60 60,61 59,60 60,59" />
    <polygon points="90,60 91,60 90,61 89,60 90,59" />
    <polygon points="120,60 121,60 120,61 119,60 120,59" />

    <!-- Row 4 -->
    <polygon points="0,90 1,90 0,91 -1,90 0,89" />
    <polygon points="30,90 31,90 30,91 29,90 30,89" />
    <polygon points="60,90 61,90 60,91 59,90 60,89" />
    <polygon points="90,90 91,90 90,91 89,90 90,89" />
    <polygon points="120,90 121,90 120,91 119,90 120,89" />

    <!-- Row 5 -->
    <polygon points="0,120 1,120 0,121 -1,120 0,119" />
    <polygon points="30,120 31,120 30,121 29,120 30,119" />
    <polygon points="60,120 61,120 60,121 59,120 60,119" />
    <polygon points="90,120 91,120 90,121 89,120 90,119" />
    <polygon points="120,120 121,120 120,121 119,120 120,119" />
  </g>
</svg>
